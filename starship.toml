add_newline = false

format = """
$username\
$hostname\
$localip\
$directory\
$python\
$kubernetes\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$fill\
$memory_usage\
$time\
$sudo\
$line_break\
$jobs\
$status\
$os\
$container\
$shell\
$character
"""

[kubernetes]
disabled = false
symbol = "☸ "
style = "bright-cyan"
format = '[$symbol$context( \($namespace\))]($style) '

[fill]
symbol = " "

[time]
disabled = true
use_12hr = true
style = "bright-black"
format = ' [$time]($style)'

[git_status]
modified = "~"
ahead = ""
behind = ""
style = "bright-yellow"

[git_branch]
symbol = " "
style = "bright-red"
format = '[$symbol$branch(:$remote_branch)]($style) '

[memory_usage]
disabled = false
threshold = 85
format = '[${ram}( | ${swap})]($style) '

[directory]
truncation_length = 3
truncate_to_repo = false
fish_style_pwd_dir_length = 1

[cmd_duration]
disabled = true

[python]
symbol = "🐍 "
pyenv_version_name = true
format = '[$symbol$pyenv_prefix($version )]($style)[(\($virtualenv\) )]($style)'
style = "bright-blue"
